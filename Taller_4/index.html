<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Registro</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="main">
            <label> Apellidos: </label>
            <input type="text" id="apellidos" placeholder="Apellidos">
            <label> Nombre: </label>
            <input type="text" id="nombres" placeholder="Nombres">
            <label> Cedula: </label>
            <input type="number" id="cedula" placeholder="9999999999">
            <label> Dirección: </label>
            <input type="text" id="direccion" placeholder="calle - avenida">
            <label> Telefono: </label>
            <input type="number" id="telefono" placeholder="0999999999">
            <label> Correo </label>
            <input type="email" id="mail" placeholder="estudent@mail.com">
            <label> Facultad: </label>
            <input type="Text" id="facu" placeholder="Fcvt">
            <label> Nivel: </label>
            <input type="text" id="nivel" placeholder="primero">
            <label> Paralelo: </label>
            <input type="text" id="paralelo" placeholder="A/B/C">
            <button type="button" id="btn">Registrar</button>
        </div>
    </body>
</html>
